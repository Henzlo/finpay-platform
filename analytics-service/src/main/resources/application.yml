server:
  port: 8085

spring:
  application:
    name: analytics-service
  config:
    import: optional:configserver:http://config:config_pass@localhost:8888
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/finpay_db
    username: finpay_user
    password: finpay_pass
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: analytics-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false

eureka:
  client:
    service-url:
      defaultZone: http://eureka:eureka_pass@localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
