server:
  port: 8081
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/finpay_db
    username: ${DB_USERNAME:finpay_user}
    password: ${DB_PASSWORD:finpay_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
jwt:
  secret: ${JWT_SECRET:finpay-secret-key}
  expiration: 3600000
  refresh-expiration: 604800000
