server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    # Serves configuration from the local classpath. Switch to the "git" profile
    # to source it from a repository instead.
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config
        git:
          uri: ${CONFIG_REPO_URI:https://github.com/finpay/finpay-config.git}
          default-label: main
          clone-on-start: true
          search-paths: '{application}'
  security:
    user:
      name: ${CONFIG_SERVER_USER:finpay}
      password: ${CONFIG_SERVER_PASSWORD:finpay}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info,busrefresh
