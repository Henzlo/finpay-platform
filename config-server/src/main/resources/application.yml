server:
  port: 8888

spring:
  application:
    name: config-server
  security:
    user:
      name: config
      password: ${CONFIG_PASSWORD:config_pass}
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/configs

eureka:
  client:
    service-url:
      defaultZone: http://eureka:eureka_pass@localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,bus-refresh
