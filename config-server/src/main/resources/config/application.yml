# Defaults served by config-server to every FinPay service that imports it.
# Per-service overrides belong in <service-name>.yml alongside this file.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

eureka:
  client:
    registry-fetch-interval-seconds: 10
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10

finpay:
  platform:
    version: 1.0.0-SNAPSHOT
