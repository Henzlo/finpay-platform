server:
  port: 8084

spring:
  application:
    name: notification-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}
  cloud:
    config:
      # config-server requires basic auth. Without these the optional import
      # fails with only a warning and the service silently keeps these defaults.
      username: ${CONFIG_SERVER_USER:finpay}
      password: ${CONFIG_SERVER_PASSWORD:finpay}
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/finpay_notifications}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.finpay.*

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}

finpay:
  notification:
    from-address: no-reply@finpay.com
    retry:
      max-attempts: 3
      backoff: 2s
  kafka:
    topics:
      user-events: finpay.user.events
      loan-events: finpay.loan.events
      payment-events: finpay.payment.events

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
