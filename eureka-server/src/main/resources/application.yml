server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  instance:
    hostname: localhost
  client:
    # The registry does not register with itself.
    register-with-eureka: false
    fetch-registry: false
  server:
    # Disabled for local development so a small number of instances is not
    # mistaken for a network partition.
    enable-self-preservation: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.netflix.eureka: INFO
    com.netflix.discovery: INFO
