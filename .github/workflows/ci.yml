# Workflow badge for README:
# https://github.com/Henzlo/finpay-platform/actions/workflows/ci.yml/badge.svg

name: FinPay CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: finpay-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: finpay_test
          POSTGRES_USER: finpay_user
          POSTGRES_PASSWORD: finpay_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finpay_user -d finpay_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval \"db.runCommand({ ping: 1 }).ok\" --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build
        run: mvn -B clean package -DskipTests

      - name: Test
        run: mvn -B test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/finpay_test
          SPRING_DATASOURCE_USERNAME: finpay_user
          SPRING_DATASOURCE_PASSWORD: finpay_pass
          SPRING_DATA_REDIS_HOST: localhost
          OPENAI_API_KEY: test-key-placeholder

      - name: Upload Surefire test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-results
          path: "**/target/surefire-reports/"
          if-no-files-found: warn
          retention-days: 14

      - name: Upload JaCoCo coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: |
            **/target/site/jacoco/
            **/target/jacoco.exec
          if-no-files-found: warn
          retention-days: 14

  code-quality:
    name: code-quality
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Checkstyle (warn only)
        continue-on-error: true
        run: mvn -B checkstyle:check

      - name: Dependency analyze (warn only)
        continue-on-error: true
        run: mvn -B dependency:analyze

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build jars
        run: mvn -B clean package -DskipTests

      - name: Create auth-service Dockerfile (POC)
        # auth-service has no committed Dockerfile yet; generate a minimal
        # image from the Boot jar so this job is a working proof of concept.
        run: |
          printf '%s\n' \
            'FROM eclipse-temurin:17-jre-alpine' \
            'WORKDIR /app' \
            'COPY target/auth-service-*.jar app.jar' \
            'EXPOSE 8081' \
            'ENTRYPOINT ["java","-jar","/app/app.jar"]' \
            > auth-service/Dockerfile
          cat auth-service/Dockerfile

      - name: Build auth-service image
        run: docker build -t "finpay/auth-service:${{ github.sha }}" ./auth-service

      - name: Print image size
        run: docker images "finpay/auth-service:${{ github.sha }}" --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"
