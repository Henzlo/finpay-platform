server:
  port: 8086

spring:
  application:
    name: chatbot-service
  config:
    import: optional:configserver:http://config:config_pass@localhost:8888
  data:
    mongodb:
      uri: mongodb://localhost:27017/finpay_chatbot
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:placeholder}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.7
          max-tokens: 500

eureka:
  client:
    service-url:
      defaultZone: http://eureka:eureka_pass@localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

chatbot:
  system-prompt: |
    You are FinPay Assistant, a helpful AI for a
    fintech lending platform. You help users with:
    - Loan application queries
    - EMI payment information
    - Account and profile questions
    - General financial advice
    Keep responses concise, friendly, and helpful.
    If asked about specific account data,
    acknowledge you need to check their account.
    Always respond in the same language the user uses.
